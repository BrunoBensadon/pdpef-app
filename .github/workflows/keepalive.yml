name: Keep Supabase awake
# Supabase pauses a free project after 7 days of low database activity. Daily runs with retries
# mean several runs in a row would have to fail before that, and GitHub emails the owner on each
# failed scheduled run.
on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC (GitHub often starts it hours late)
  workflow_dispatch:
permissions:
  contents: read
  actions: write # re-enable this workflow, see the last step
jobs:
  ping:
    # This file is the template copied into pdpef-app (docs/DEPLOY.md). Only that repo has the
    # secrets, so the source repo skips the job instead of failing.
    if: github.repository == 'BrunoBensadon/pdpef-app'
    runs-on: ubuntu-latest
    steps:
      - name: Call the ping RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body=$(curl -sS --retry 5 --retry-all-errors --retry-delay 60 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "$body"
          test "$body" = '"ok"'
      # GitHub disables scheduled workflows in a public repo after 60 days without repository
      # activity, and pdpef-app only changes when the site is published. Enabling the workflow
      # through the API resets that counter.
      - name: Keep this schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/keepalive.yml/enable"
