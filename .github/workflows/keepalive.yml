name: Keep Supabase awake
on:
  schedule:
    - cron: "17 9 * * 1,4" # Mondays and Thursdays 09:17 UTC
  workflow_dispatch:
jobs:
  ping:
    # This file is the template copied into pdpef-app (docs/DEPLOY.md). Only that repo has the
    # secrets, so the source repo skips the job instead of failing.
    if: github.repository == 'BrunoBensadon/pdpef-app'
    runs-on: ubuntu-latest
    steps:
      - name: Call the ping RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body=$(curl -s -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Content-Type: application/json" -d '{}')
          echo "$body"
          test "$body" = '"ok"'
