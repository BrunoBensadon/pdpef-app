<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDPEF</title>
<style>
  @font-face { font-family:"Overpass"; font-weight:700; font-display:swap;
    src:url("fonts/overpass-700.woff2") format("woff2"); }
  @font-face { font-family:"Source Serif 4"; font-weight:400; font-display:swap;
    src:url("fonts/source-serif-400.woff2") format("woff2"); }
  @font-face { font-family:"Source Serif 4"; font-weight:700; font-display:swap;
    src:url("fonts/source-serif-700.woff2") format("woff2"); }
  @font-face { font-family:"Overpass"; font-weight:800; font-display:swap;
    src:url("fonts/overpass-800.woff2") format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:400; font-display:swap;
    src:url("fonts/source-sans-400.woff2") format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:600; font-display:swap;
    src:url("fonts/source-sans-600.woff2") format("woff2"); }
  @font-face { font-family:"Source Sans 3"; font-weight:700; font-display:swap;
    src:url("fonts/source-sans-700.woff2") format("woff2"); }
  :root {
    --blue:#0072CE; --orange:#FF671F; --ink:#1D1E1C; --dim:#6b6b73;
    --green:#509E2F; --magenta:#AA0061; --amber:#FFC72C; --red:#F9423A;
    --line:#dbd9d8; --bg:#f3f2f2; --card:#fff;
    --area1:#0072CE; --area1bg:#e8f1fb; --area2:#509E2F; --area2bg:#eef6ea;
    --area3:#AA0061; --area3bg:#f7e9f1; --area4:#B8860B; --area4bg:#fbf3dc;
    --s1:.25rem; --s2:.5rem; --s3:.8rem; --s4:1.2rem; --s5:1.8rem;
    --r:8px; --r-lg:14px; --sh:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
    --font-head:"Overpass",system-ui,sans-serif;
    --font-body:"Source Sans 3",system-ui,sans-serif;
  }
  * { box-sizing: border-box; }
  body { font-family:var(--font-body); margin:0; background:var(--bg); color:var(--ink);
    font-size:16px; line-height:1.4; }
  h1,h2,h3,h4 { font-family:var(--font-head); font-weight:800; line-height:1.15; }
  #app { padding-bottom: 4.5rem; }
  header.bar { position:sticky; top:0; z-index:5; background:var(--card);
    border-bottom:2px solid var(--ink); padding:var(--s3);
    display:flex; align-items:center; gap:var(--s3); }
  header.bar .brand { display:flex; align-items:center; gap:var(--s2); }
  header.bar .brand svg { display:block; }
  header.bar .brand svg, .welcome .logo svg, .printhead svg { fill: var(--blue); }
  header.bar h1 { font-size:1.2rem; margin:0; color:var(--ink);
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-weight:700; letter-spacing:.01em; }
  header.bar .spacer { flex:1; }
  header.bar .who { font-size:.85rem; color:var(--dim); font-family:"Source Serif 4",Georgia,"Times New Roman",serif; }
  .menubtn { border:0; background:none; font-size:1.4rem; line-height:1; color:#201e1d;
    min-width:44px; min-height:44px; padding:.2rem .5rem; cursor:pointer; border-radius:2px; }
  .menubtn:active { background:rgba(32,30,29,.1); }
  .menu { position:absolute; top:3.4rem; right:var(--s3); background:#fff;
    border:1px solid rgba(32,30,29,.16); border-radius:2px;
    box-shadow:0 3px 10px rgba(45,43,43,.16); min-width:12rem; z-index:8; overflow:hidden; }
  .menu button { display:block; width:100%; text-align:left; background:none; border:0;
    padding:.8rem var(--s3); min-height:44px; font-size:.95rem; font-family:"Source Serif 4",Georgia,"Times New Roman",serif;
    cursor:pointer; color:#201e1d; }
  .menu button:active { background:rgba(32,30,29,.07); }
  .menu[hidden] { display:none; }
  nav.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; z-index:5;
    background:#f3f2f2; border-top:1px solid rgba(32,30,29,.16);
    box-shadow:0 -1px 3px rgba(45,43,43,.08); }
  nav.tabs a { flex:1; min-height:56px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:.9rem .2rem calc(.9rem + env(safe-area-inset-bottom));
    font-size:.95rem; font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-weight:600;
    color:rgba(32,30,29,.55); text-decoration:none; border-top:3px solid transparent; }
  nav.tabs a.on { color:#0088b0; border-top-color:#0088b0; font-weight:700; }
  nav.tabs a:active { background:rgba(0,136,176,.08); }
  main { padding:.8rem; }
  .gridwrap { overflow-x:auto; background:var(--card); border:1px solid var(--line);
    border-radius:var(--r); box-shadow:var(--sh); }
  table.grid { border-collapse:collapse; font-size:.8rem; }
  table.grid th, table.grid td { border:1px solid var(--line); padding:.4rem .45rem;
    text-align:center; min-width:2.4rem; }
  table.grid th.kid { position:sticky; left:0; background:var(--card); text-align:left;
    max-width:9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; z-index:2;
    font-weight:600; }
  table.grid th.g1 { background:var(--area1bg); color:var(--area1); }
  table.grid th.g2 { background:var(--area2bg); color:var(--area2); }
  table.grid th.g3 { background:var(--area3bg); color:var(--area3); }
  table.grid th.g4 { background:var(--area4bg); color:var(--area4); }
  table.grid th a { color:inherit; text-decoration:none; font-weight:800; }
  .goalhint { position:sticky; top:3.4rem; z-index:4; display:flex; align-items:center;
    justify-content:space-between; gap:var(--s2); padding:.5rem .8rem; margin-bottom:var(--s2);
    border-radius:var(--r); font-size:.85rem; box-shadow:var(--sh); }
  .goalhint:empty { display:none; padding:0; margin:0; box-shadow:none; }
  .goalhint a { color:inherit; font-weight:800; text-decoration:none; white-space:nowrap; }
  .goalhint.a1 { background:var(--area1bg); color:var(--area1); }
  .goalhint.a2 { background:var(--area2bg); color:var(--area2); }
  .goalhint.a3 { background:var(--area3bg); color:var(--area3); }
  .goalhint.a4 { background:var(--area4bg); color:var(--area4); }
  tr.deleg td { background:var(--ink); color:#fff; font-weight:700; text-align:left;
    letter-spacing:.02em; }
  td.cell { cursor:pointer; color:var(--dim); min-height:2.2rem; }
  td.cell.some { font-weight:700; }
  td.cell.some.a1 { background:var(--area1bg); color:var(--area1); }
  td.cell.some.a2 { background:var(--area2bg); color:var(--area2); }
  td.cell.some.a3 { background:var(--area3bg); color:var(--area3); }
  td.cell.some.a4 { background:var(--area4bg); color:var(--area4); }
  td.cell:active { outline:2px solid var(--orange); outline-offset:-2px; }
  .pill { display:inline-flex; align-items:center; background:#eae9e9; color:#201e1d;
    border:1px solid transparent; border-radius:2px; padding:.25rem .6rem; margin:.15rem;
    font-size:.85rem; letter-spacing:.02em; }
  .pill.note { background:transparent; border:1px dashed rgba(32,30,29,.32); color:#5a5856; }
  .pill .rm, .pill .undo { margin-left:.2rem; padding:.1rem .35rem; text-decoration:none;
    color:#d6006c; font-weight:700; border-radius:2px; }
  .pill .rm:active, .pill .undo:active { background:rgba(214,0,108,.12); }
  .pill .undo { font-size:.8rem; }
  /* Broadsheet action system — paper, ink, one cyan fill */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
    min-height:44px; padding:.5rem 1.2rem; font-size:.95rem; letter-spacing:.01em;
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-weight:600; color:#201e1d;
    background:transparent; border:1px solid rgba(32,30,29,.32); border-radius:2px;
    cursor:pointer; text-decoration:none; }
  .btn:active { background:rgba(32,30,29,.14); }
  .btn.primary { background:#0088b0; border-color:#0088b0; color:#f3f2f2;
    box-shadow:0 1px 2px rgba(45,43,43,.14); }
  .btn.primary:active { background:#006c8d; border-color:#006c8d; box-shadow:none; }
  .btn.danger { color:#d6006c; border-color:#d6006c; }
  .btn.danger:active { background:rgba(214,0,108,.12); }
  .btn:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }
  .btn.loading { color:transparent; position:relative; pointer-events:none; }
  .btn.loading::after { content:""; position:absolute; width:1rem; height:1rem;
    border-radius:50%; border:2px solid rgba(243,242,242,.4); border-top-color:#f3f2f2;
    animation:btnspin .7s linear infinite; }
  .btn.loading:not(.primary)::after { border-color:rgba(32,30,29,.25); border-top-color:#201e1d; }
  @keyframes btnspin { to { transform:rotate(1turn); } }
  .btn:focus-visible, .menubtn:focus-visible, nav.tabs a:focus-visible, .menu button:focus-visible,
  .picker-list button:focus-visible, .userlist button:focus-visible {
    outline:2px solid #0088b0; outline-offset:2px; }
  .picker-list button, .userlist button { display:block; width:100%; text-align:left;
    background:#fff; border:1px solid rgba(32,30,29,.16); border-radius:2px;
    padding:.7rem .9rem; margin:.4rem 0; min-height:44px; font-size:.95rem;
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif; color:#201e1d; cursor:pointer; }
  .picker-list button:active, .userlist button:active {
    background:rgba(32,30,29,.07); border-color:#0088b0; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10;
    display:flex; align-items:flex-end; }
  .sheet .panel { background:var(--card); width:100%; max-height:85vh; overflow-y:auto;
    border-radius:var(--r-lg) var(--r-lg) 0 0; padding:var(--s4) var(--s3) var(--s3);
    position:relative; }
  .sheet .panel::before { content:""; position:absolute; top:.5rem; left:50%;
    width:2.4rem; height:.3rem; margin-left:-1.2rem; border-radius:999px; background:var(--line); }
  .queuebadge { position:fixed; bottom:4rem; right:.8rem; background:var(--amber);
    color:var(--ink); border:1px solid #B8860B; border-radius:2px; padding:.3rem .7rem;
    font-size:.82rem; font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-weight:600;
    box-shadow:0 2px 6px rgba(45,43,43,.18); z-index:6; }
  .goalhead { font-size:1rem; color:var(--ink); margin:var(--s3) 0 var(--s2);
    font-family:"Source Serif 4",Georgia,"Times New Roman",serif; font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r);
    padding:var(--s3); margin:var(--s3) 0; box-shadow:var(--sh); border-left:4px solid var(--line); }
  .card.a1 { border-left-color:var(--area1); } .card.a2 { border-left-color:var(--area2); }
  .card.a3 { border-left-color:var(--area3); } .card.a4 { border-left-color:var(--area4); }
  .muted { color:var(--dim); font-size:.8rem; }
  input[type=text], input[type=search] { width:100%; padding:.6rem; font-size:1rem;
    border:1px solid var(--line); border-radius:var(--r); font-family:var(--font-body); }
  input[type=search]:focus, input[type=text]:focus { outline:2px solid var(--blue);
    outline-offset:-1px; border-color:var(--blue); }
  .welcome { max-width:22rem; margin:2.5rem auto; text-align:center; padding:0 var(--s3); }
  .welcome .logo { margin-bottom:var(--s4); }
  .welcome h2 { font-size:1.3rem; margin:.4rem 0; }
  .welcome .btn.primary { width:100%; margin-top:var(--s3); }
  .userlist { max-width:26rem; margin:1.5rem auto; }
  .userlist button { display:flex; justify-content:space-between; align-items:center; }
  .skel { padding:var(--s3); }
  .skel .bar { height:2.6rem; background:var(--card); border-bottom:1px solid var(--line);
    margin:calc(-1*var(--s3)) calc(-1*var(--s3)) var(--s3); }
  .skel .row { height:1.6rem; border-radius:var(--r); margin:.5rem 0;
    background:linear-gradient(90deg,#ececf1 25%,#f6f6f8 37%,#ececf1 63%);
    background-size:400% 100%; animation:sk 1.2s ease infinite; }
  @keyframes sk { 0%{background-position:100% 0} 100%{background-position:0 0} }
  .toast { position:fixed; left:50%; bottom:4.2rem; transform:translateX(-50%);
    max-width:90%; background:var(--ink); color:#fff; padding:.6rem .9rem;
    border-radius:var(--r); box-shadow:var(--sh); z-index:20; font-size:.9rem;
    animation:toastin .2s ease; }
  .toast[data-kind="error"] { background:var(--red); }
  .toast[data-kind="success"] { background:var(--green); }
  @keyframes toastin { from{opacity:0; transform:translate(-50%,.5rem)} to{opacity:1} }

  /* Multi-programme additions */
  input[type=email], input[type=password], select, textarea { width:100%; padding:.6rem; font-size:1rem;
    border:1px solid var(--line); border-radius:var(--r); font-family:var(--font-body); background:#fff; }
  textarea { min-height:8rem; }
  .progbtn { border:0; background:none; font:inherit; cursor:pointer; text-align:left; padding:0;
    min-height:44px; display:flex; align-items:center; color:inherit; }
  .switcher { position:absolute; top:3.4rem; left:var(--s3); right:var(--s3); max-width:24rem; background:#fff;
    border:1px solid rgba(32,30,29,.16); border-radius:2px; box-shadow:0 3px 10px rgba(45,43,43,.16);
    z-index:8; padding:.4rem 0; }
  .switcher[hidden] { display:none; }
  .switcher h4 { margin:.4rem var(--s3); font-size:.75rem; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; }
  .switcher a { display:flex; justify-content:space-between; gap:var(--s2); padding:.7rem var(--s3); min-height:44px;
    color:var(--ink); text-decoration:none; }
  .switcher a.on { font-weight:700; color:#0088b0; }
  .switcher a.past { color:var(--dim); }
  .banner { display:flex; gap:var(--s2); align-items:center; justify-content:space-between; padding:.6rem .8rem;
    margin-bottom:var(--s2); border-radius:var(--r); font-size:.9rem; background:var(--area4bg); color:var(--ink); }
  .banner.warn { background:#fde8e7; }
  .langtoggle { display:flex; justify-content:center; gap:.3rem; margin-bottom:var(--s3); }
  .langtoggle button { border:1px solid rgba(32,30,29,.32); background:transparent; padding:.3rem .7rem;
    min-height:36px; cursor:pointer; font:inherit; border-radius:2px; }
  .langtoggle button.on { background:#0088b0; border-color:#0088b0; color:#fff; }
  .authform { text-align:left; }
  .authform label { display:block; margin:.6rem 0; font-size:.9rem; }
  .authform label input, .authform label select, .authform label textarea { margin-top:.2rem; }
  .formerr { color:var(--red); min-height:1.2em; font-size:.9rem; margin:.3rem 0; }
  .formok { color:var(--green); font-size:.9rem; }
  .btn.wide { width:100%; }
  .or { color:var(--dim); margin:.6rem 0; }
  .member select { width:auto; display:inline-block; margin:.3rem 0; }
  code.joincode { font-size:1.2rem; font-weight:700; letter-spacing:.05em; }
  .adminlist .card { display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center; justify-content:space-between; }
  /* Official Individual Evaluation Form (screen preview + print) */
  .printbar { display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center; margin-bottom:var(--s3); }
  .printbar .langtoggle { margin:0; }
  .evalform { max-width:19cm; margin:0 auto 2rem; background:#fff; padding:1rem; color:#000;
    font-family:Arial, Helvetica, sans-serif; font-size:10pt; line-height:1.3; }
  .formhead { display:flex; align-items:center; justify-content:space-between; gap:1rem;
    border-bottom:1px solid #000; padding-bottom:.4rem; margin-bottom:.6rem; }
  .formhead img { width:55mm; height:auto; }
  .formhead h2 { font-family:Arial, Helvetica, sans-serif; font-size:13pt; font-weight:700; margin:0; text-align:right; }
  .formwho { margin:.4rem 0 .6rem; }
  .formprog { color:#444; font-size:9pt; }
  table.formtable { width:100%; border-collapse:collapse; table-layout:fixed; }
  table.formtable th, table.formtable td { border:1px solid #000; padding:.25rem .35rem; vertical-align:top; text-align:left; }
  table.formtable .yn { text-align:center; }
  table.formtable tr.goalrow td { background:#E6E6E6; font-weight:700; }
  table.formtable ul { margin:0; padding-left:1.1em; }
  .formfoot { margin-top:.6rem; font-size:8pt; color:#444; text-align:center; }
  @media print {
    @page { size:A4; margin:15mm; }
    nav.tabs, header.bar, .queuebadge, .noprint, .banner, .toast { display:none !important; }
    body { background:#fff; } #app { padding:0; } main { padding:0; }
    .evalform { padding:0; margin:0; max-width:none; break-after:page; }
    .evalform:last-child { break-after:auto; }
    table.formtable thead { display:table-header-group; }
    table.formtable tr { break-inside:avoid; }
    table.formtable tr.goalrow td { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>
<div id="app"></div>
<script type="module" src="main.mjs"></script>
