<script type="module">
"use strict";
// Pure shared logic for the PDPEF app. No DOM, no network, no globals mutated.
const AREAS = {
  "1": "To become more aware of ourselves, other people and cultures, and the wider world.",
  "2": "To be willing to be a responsible and active member of our communities.",
  "3": "To be able to take action for positive social change within our communities.",
  "4": "To understand peace, non-violent action, and social justice.",
};
const GOAL_TEXTS = {
  "1a": "Aware of and care for oneself",
  "1b": "Willing to have positive attitudes towards others",
  "1c": "Able to respect oneself, others, and our differences",
  "1d": "Understand theme and how it relates to oneself and others",
  "2a": "Aware of one's own responsibilities",
  "2b": "Willing to actively participate in the community",
  "2c": "Able to cooperate and build trust with others",
  "2d": "Understands how to contribute to a peaceful and inclusive community",
  "3a": "Aware of emotions in oneself and others and their impact",
  "3b": "Willing to listen and communicate respectfully with others",
  "3c": "Able to analyse and solve problems creatively",
  "3d": "Understands how to resolve conflict peacefully with others",
  "4a": "Aware of the theme and its connection to peace and social justice",
  "4b": "Willing to learn new ideas, concepts, and worldviews",
  "4c": "Able to be open minded and think critically about new ideas",
  "4d": "Understand the theme on a local, national, and global level",
};
const GOALS = Object.keys(GOAL_TEXTS).map(code => ({ code, area: code[0], text: GOAL_TEXTS[code] }));

function normText(s) {
  return String(s == null ? "" : s).normalize("NFC").replace(/\s+/g, " ").trim();
}

function buildGrid(roster, entries) {
  const grid = {};
  roster.forEach(k => { grid[k.kid_id] = {}; });
  entries.forEach(e => {
    if (e.removed_at) return;
    const row = grid[e.kid_id];
    if (!row) return;
    (row[e.goal] = row[e.goal] || []).push(e);
  });
  return grid;
}

function usageCounts(entries) {
  const c = {};
  entries.forEach(e => { if (!e.removed_at) c[e.ev_id] = (c[e.ev_id] || 0) + 1; });
  return c;
}

function searchLibrary(library, goal, query, kidId, counts) {
  const toks = normText(query).toLowerCase().split(" ").filter(Boolean);
  return library
    .filter(ev => ev.goal === goal && ev.status === "active"
      && (!ev.kid_only || ev.kid_only === kidId)
      && toks.every(t => ev.text.toLowerCase().indexOf(t) >= 0))
    .sort((a, b) => (counts[b.ev_id] || 0) - (counts[a.ev_id] || 0)
      || a.text.localeCompare(b.text));
}

function findExact(library, goal, text) {
  const n = normText(text).toLowerCase();
  return library.find(ev => ev.goal === goal && ev.status === "active"
    && !ev.kid_only && normText(ev.text).toLowerCase() === n) || null;
}

function applyOps(data, ops) {
  let library = data.library.slice();
  let entries = data.entries.slice();
  ops.forEach(op => {
    const p = op.payload;
    if (op.method === "addEvidence" && !library.some(e => e.ev_id === p.id)) {
      library.push({ ev_id: p.id, goal: p.goal, text: normText(p.text), added_by: p.author,
        added_at: op.at, status: "active", kid_only: p.kidOnly || "" });
    } else if (op.method === "addEntry"
      && !entries.some(e => e.entry_id === p.id)
      && !entries.some(e => e.kid_id === p.kidId && e.goal === p.goal
        && e.ev_id === p.evId && !e.removed_at)) {
      entries.push({ entry_id: p.id, kid_id: p.kidId, goal: p.goal, ev_id: p.evId,
        added_by: p.author, added_at: op.at, removed_by: "", removed_at: "" });
    } else if (op.method === "removeEntry") {
      entries = entries.map(e => e.entry_id === p.entryId
        ? Object.assign({}, e, { removed_by: p.author, removed_at: op.at }) : e);
    } else if (op.method === "hideEvidence") {
      library = library.map(e => e.ev_id === p.evId
        ? Object.assign({}, e, { status: "hidden" }) : e);
    }
  });
  return { library, entries };
}

function canSelfUndo(entry, user, now, windowMs) {
  return !!entry && entry.added_by === user && !entry.removed_at &&
    (now - Date.parse(entry.added_at)) <= windowMs;
}

const PDPEF = { GOALS, AREAS, normText, buildGrid, usageCounts, searchLibrary, findExact, applyOps, canSelfUndo };
if (typeof window !== "undefined") window.PDPEF = PDPEF;
export { GOALS, AREAS, normText, buildGrid, usageCounts, searchLibrary, findExact, applyOps, canSelfUndo };

</script>

w1MTUuMzcwNTcpIiBmaWxsPSIjZmZkNzAwIi8+PC9nPjwvc3ZnPg==">';

  // Fill these in at deploy (placeholder convention). Empty string => the field is omitted.
  var CAMP = { name: "Ginga Village", year: "2026", theme: "Cultural Identity" };

  var state = {
    user: JSON.parse(localStorage.getItem("pdpef-user") || "null"),
    data: null,          // {users, roster, library, entries} from the server
    queue: JSON.parse(localStorage.getItem("pdpef-queue") || "[]"),
    goalCountry: null,   // delegation selected in the goal view
  };

  var EXEC_URL = localStorage.getItem("pdpef-exec-url") || "";

  function rpc(method, arg) {
    if (typeof google !== "undefined" && google.script) { // served by GAS, or local mock
      return new Promise(function (resolve, reject) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](arg);
      });
    }
    // Static hosting: cookie-less cross-origin POST. No Google session is sent,
    // which sidesteps the script.google.com session-routing bug on phones.
    // text/plain avoids a CORS preflight; errors come back in-band as {ok:false}.
    return fetch(EXEC_URL, {
      method: "POST",
      credentials: "omit",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ method: method, payload: arg || null }),
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (res) {
      if (!res.ok) throw new Error(res.error);
      return res.result;
    });
  }

  function validExecUrl(u) {
    if (!/\/exec(\?|$)/.test(u) && !/^https?:\/\/(127\.|localhost|192\.168\.)/.test(u)) return false;
    return /^https:\/\/script\.google\.com\//.test(u) ||
      /^https?:\/\/(127\.|localhost|192\.168\.)/.test(u); // dev hosts allowed for testing
  }

  function showSetup(msg) {
    document.getElementById("app").innerHTML =
      '<main class="welcome"><div class="logo">' + (LOGO_MARK || '<b>CISV São Paulo</b>') +
      '</div><h2>Connect to your camp</h2>' +
      (msg ? '<p class="muted">' + esc(msg) + "</p>" : "") +
      '<p class="muted">Paste the camp code from the leaders’ group message (it’s a long link starting with https://script.google.com/…). You only do this once.</p>' +
      '<input type="text" id="codeInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">' +
      '<p><button class="btn primary" id="codeSave">Connect</button></p></main>';
    document.getElementById("codeSave").onclick = function () {
      var u = document.getElementById("codeInput").value.trim();
      if (!validExecUrl(u)) { showSetup("That doesn’t look like a camp code — it should end in /exec."); return; }
      EXEC_URL = u;
      localStorage.setItem("pdpef-exec-url", u);
      showSkeleton();
      boot();
    };
  }

  function boot() {
    showSkeleton();
    rpc("api_getAll").then(function (data) {
      state.data = data;
      render();
      flushQueue(); // drain ops queued while offline last session
    }).catch(function (err) {
      var usingFetch = !(typeof google !== "undefined" && google.script);
      document.getElementById("app").innerHTML = "Could not load: " + esc(err.message) +
        ' <a href="#" id="retry">Retry</a>' +
        (usingFetch ? ' · <a href="#" id="resetCode">Enter a different camp code</a>' : "");
      document.getElementById("retry").onclick = function (e) {
        e.preventDefault();
        showSkeleton();
        boot();
      };
      var rc = document.getElementById("resetCode");
      if (rc) rc.onclick = function (e) {
        e.preventDefault();
        localStorage.removeItem("pdpef-exec-url");
        EXEC_URL = "";
        showSetup();
      };
    });
  }

  function saveQueue() { localStorage.setItem("pdpef-queue", JSON.stringify(state.queue)); }

  var toastTimer;
  function toast(msg, kind) {
    var old = document.getElementById("toast"); if (old) old.remove();
    var t = document.createElement("div");
    t.className = "toast"; t.id = "toast"; t.setAttribute("data-kind", kind || "info");
    t.textContent = msg; document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.remove(); }, 4000);
  }

  function enqueue(method, payload) {
    state.queue.push({ method: method, at: new Date().toISOString(), payload: payload });
    saveQueue();
    render();
    flushQueue();
  }

  var flushing = false;
  function flushQueue() {
    if (flushing || !state.queue.length) return;
    flushing = true;
    var op = state.queue[0];
    rpc("api_" + op.method, op.payload).then(function (result) {
      // Server may have deduped a new evidence statement to an existing one:
      // rewrite any queued entries that reference our temporary id.
      if (op.method === "addEvidence" && result && result.ev_id !== op.payload.id) {
        state.queue.forEach(function (q) {
          if (q.payload.evId === op.payload.id) q.payload.evId = result.ev_id;
        });
      }
      mergeResult(op, result);
      state.queue.shift();
      saveQueue();
      flushing = false;
      render();
      flushQueue();
    }).catch(function (err) {
      flushing = false;
      if (/Only staff/.test(String(err && err.message))) { // permanent: drop, tell user
        state.queue.shift();
        saveQueue();
        toast("Not allowed: " + err.message, "error");
        render();
      } else { // transient (offline, lock timeout): keep op, retry soon
        setTimeout(flushQueue, 5000);
      }
    });
  }

  function mergeResult(op, result) {
    if (!result) return;
    if (op.method === "addEvidence" &&
        !state.data.library.some(function (e) { return e.ev_id === result.ev_id; })) {
      state.data.library.push(result);
    } else if (op.method === "addEntry" &&
        !state.data.entries.some(function (e) { return e.entry_id === result.entry_id; })) {
      state.data.entries.push(result);
    } else if (op.method === "removeEntry") {
      state.data.entries = state.data.entries.filter(function (e) {
        return e.entry_id !== op.payload.entryId;
      });
    } else if (op.method === "hideEvidence") {
      state.data.library.forEach(function (e) {
        if (e.ev_id === op.payload.evId) e.status = "hidden";
      });
    }
  }

  function refresh() { // pull latest state (other leaders' work) without losing the queue
    // render() rebuilds #app's innerHTML from scratch, which destroys and recreates every
    // node (including .gridwrap, whose scrollLeft always starts at 0 on a fresh element).
    // Capture scroll position before the rebuild and restore it after, but only when the
    // route is unchanged — a hash navigation that happens to land mid-flight should keep
    // its own (top-of-page) position, not inherit the old view's scroll.
    var hashBefore = location.hash;
    var scrollX = window.scrollX, scrollY = window.scrollY;
    var gridwrapBefore = document.querySelector(".gridwrap");
    var gridScrollLeft = gridwrapBefore ? gridwrapBefore.scrollLeft : null;
    rpc("api_getAll").then(function (data) {
      state.data = data;
      render();
      flushQueue();
      if (location.hash !== hashBefore) return; // route changed mid-flight: let render() stand
      var maxY = Math.max(document.documentElement.scrollHeight - window.innerHeight, 0);
      window.scrollTo(scrollX, Math.min(scrollY, maxY));
      var gridwrapAfter = document.querySelector(".gridwrap");
      if (gridwrapAfter && gridScrollLeft != null) {
        var maxX = Math.max(gridwrapAfter.scrollWidth - gridwrapAfter.clientWidth, 0);
        gridwrapAfter.scrollLeft = Math.min(gridScrollLeft, maxX);
      }
    });
  }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && state.data) refresh();
  });
  setInterval(function () { if (!document.hidden && state.data) refresh(); }, 60000);

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showSkeleton() {
    document.getElementById("app").innerHTML =
      '<div class="skel"><div class="bar"></div>' +
      Array(8).join('<div class="row"></div>') + '</div>';
  }

  function areaOf(code) { return code[0]; } // "1".."4"

  function view() { // server data + optimistic queue
    return PDPEF.applyOps(state.data, state.queue);
  }

  function isStaff() {
    return !!state.user && state.data.users.some(function (u) {
      return u.name === state.user && u.role === "staff";
    });
  }

  function myDelegation() {
    var u = state.data.users.filter(function (u) { return u.name === state.user; })[0];
    return (u && u.delegation) || state.data.roster[0].country;
  }

  function render() {
    if (!state.data) return;
    if (!state.user) return pickUser();
    var h = location.hash || "#grid";
    var m;
    if ((m = h.match(/^#goal\/(\w\w)$/))) return renderGoal(m[1]);
    if ((m = h.match(/^#kid\/(\w+)$/))) return renderKid(m[1]);
    if ((m = h.match(/^#print\/(\w+)$/))) return renderPrint(m[1]);
    renderGrid();
  }

  function pickUser() {
    var html = '<main class="welcome"><div class="logo">' + (LOGO_MARK || '') + '</div>' +
      '<h2>Who are you?</h2></main><div class="userlist">' +
      state.data.users.map(function (u) {
        return '<button data-name="' + esc(u.name) + '">' + esc(u.name) +
          ' <span class="muted">' + esc(u.role === "staff" ? "staff" : u.delegation) +
          "</span></button>";
      }).join("") + "</div>";
    document.getElementById("app").innerHTML = html;
    document.querySelectorAll(".userlist button").forEach(function (b) {
      b.onclick = function () {
        state.user = b.dataset.name;
        localStorage.setItem("pdpef-user", JSON.stringify(state.user));
        render();
      };
    });
  }

  function renderShell(active, content) {
    var tabs = [["#grid", "Overview"], ["#goal/1a", "By goal"],
                ["#kid/" + state.data.roster[0].kid_id, "By kid"]];
    document.getElementById("app").innerHTML =
      '<header class="bar"><span class="brand">' +
        (LOGO_MARK || '') + '<h1>PDPEF</h1></span>' +
        '<span class="spacer"></span>' +
        '<span class="who">' + esc(state.user) + '</span>' +
        '<button class="menubtn" id="menuBtn" aria-label="Menu">⋮</button>' +
        '<div class="menu" id="appMenu" hidden>' +
          '<button id="printAll">Print all participants</button>' +
          '<button id="switchUser">Switch user</button>' +
        '</div></header>' +
      "<main>" + content + "</main>" +
      '<nav class="tabs">' + tabs.map(function (t) {
        return '<a href="' + t[0] + '" class="' + (t[1] === active ? "on" : "") + '">' + t[1] + "</a>";
      }).join("") + "</nav>" +
      (state.queue.length ? '<div class="queuebadge">' + state.queue.length + " saving…</div>" : "");
    var menuBtn = document.getElementById("menuBtn"), menu = document.getElementById("appMenu");
    menuBtn.onclick = function (e) { e.stopPropagation(); menu.hidden = !menu.hidden; };
    document.addEventListener("click", function () { menu.hidden = true; });
    document.getElementById("printAll").onclick = function () { location.hash = "#print/all"; };
    document.getElementById("switchUser").onclick = function () {
      state.user = null; localStorage.removeItem("pdpef-user"); render();
    };
  }

  function renderGrid() {
    var v = view();
    var grid = PDPEF.buildGrid(state.data.roster, v.entries);
    var byCountry = {};
    state.data.roster.forEach(function (k) {
      (byCountry[k.country] = byCountry[k.country] || []).push(k);
    });
    var head = "<tr><th class='kid'>Participant</th>" + PDPEF.GOALS.map(function (g) {
      return '<th class="g' + areaOf(g.code) + '"><a href="#goal/' + g.code + '" data-goal="' +
        g.code + '">' + g.code + "</a></th>";
    }).join("") + "</tr>";
    var body = Object.keys(byCountry).map(function (c) {
      return '<tr class="deleg"><td colspan="17">' + esc(c) + "</td></tr>" +
        byCountry[c].map(function (k) {
          return '<tr><th class="kid"><a href="#kid/' + k.kid_id + '">' + esc(k.name) + "</a></th>" +
            PDPEF.GOALS.map(function (g) {
              var n = (grid[k.kid_id][g.code] || []).length;
              return '<td class="cell ' + (n ? "some a" + areaOf(g.code) : "") + '" data-kid="' +
                k.kid_id + '" data-goal="' + g.code + '">' + (n || "") + "</td>";
            }).join("") + "</tr>";
        }).join("");
    }).join("");
    renderShell("Overview", '<div id="goalhint" class="goalhint"></div>' +
      '<div class="gridwrap"><table class="grid">' + head + body +
      "</table></div><p class='muted'>Tap a cell to add evidence. Tap a goal code to see its wording, or a name for the focused views.</p>");
    document.querySelectorAll("td.cell").forEach(function (td) {
      td.onclick = function () { openEditor(td.dataset.kid, td.dataset.goal); };
    });
    document.querySelectorAll("table.grid th a[data-goal]").forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var code = a.dataset.goal, goal = goalByCode(code);
        var hint = document.getElementById("goalhint");
        hint.className = "goalhint a" + areaOf(code);
        hint.innerHTML = "<span>" + code + ") " + esc(goal.text) + "</span>" +
          '<a href="#goal/' + code + '">open goal &#9656;</a>';
      };
    });
  }

  function closeSheet() {
    var el = document.getElementById("sheet");
    if (el) el.remove();
  }

  function kidById(id) {
    return state.data.roster.filter(function (k) { return k.kid_id === id; })[0];
  }

  function goalByCode(code) {
    return PDPEF.GOALS.filter(function (g) { return g.code === code; })[0];
  }

  function openEditor(kidId, goalCode, onDone) {
    var kid = kidById(kidId), goal = goalByCode(goalCode);
    var el = document.createElement("div");
    el.className = "sheet"; el.id = "sheet";
    // Attach to <body>, NOT #app: enqueue() re-renders #app (optimistic update),
    // which would destroy an open sheet mid-edit.
    document.body.appendChild(el);

    // Static shell built ONCE: #q is never recreated, so a keystroke never
    // steals focus/caret. Only #current, #results and #actions get rewritten.
    el.innerHTML = '<div class="panel">' +
      "<h3>" + esc(kid.name) + " (" + esc(kid.country) + ") — " + goalCode + "</h3>" +
      '<p class="goalhead">' + esc(goal.text) + "</p>" +
      '<div id="current"></div><hr>' +
      '<input type="search" id="q" placeholder="Search evidence or type new…" autocomplete="off">' +
      '<div class="picker-list" id="results"></div>' +
      '<div id="actions"></div>' +
      '<p style="text-align:right"><button class="btn" id="done">Done</button></p></div>';

    el.querySelector("#done").onclick = function () { closeSheet(); if (onDone) onDone(); render(); };
    el.onclick = function (e) { if (e.target === el) { closeSheet(); render(); } };
    var q = el.querySelector("#q");
    q.oninput = function () { draw(q.value); };

    function draw(query) {
      var v = view();
      var evText = {};
      v.library.forEach(function (e) { evText[e.ev_id] = e; });
      var current = (PDPEF.buildGrid(state.data.roster, v.entries)[kidId] || {})[goalCode] || [];
      var counts = PDPEF.usageCounts(v.entries);
      var results = PDPEF.searchLibrary(v.library, goalCode, query, kidId, counts)
        .filter(function (ev) {
          return !current.some(function (en) { return en.ev_id === ev.ev_id; });
        }).slice(0, 12);
      var exact = PDPEF.findExact(v.library, goalCode, query);

      el.querySelector("#current").innerHTML = current.length ? current.map(function (en) {
        var ev = evText[en.ev_id] || { text: en.ev_id };
        return '<span class="pill">' + esc(ev.text) +
          (ev.kid_only ? ' <span class="muted">(note)</span>' : "") +
          (isStaff()
            ? ' <a href="#" class="rm" data-entry="' + en.entry_id + '">✕</a>'
            : (PDPEF.canSelfUndo(en, state.user, Date.now(), 900000)
                ? ' <a href="#" class="undo" data-entry="' + en.entry_id + '">undo</a>' : "")) +
          "</span>";
      }).join("") : '<span class="muted">No evidence yet.</span>';

      el.querySelector("#results").innerHTML = results.map(function (ev) {
        return '<button data-ev="' + ev.ev_id + '">' + esc(ev.text) +
          (ev.kid_only ? ' <span class="muted">(note)</span>' : "") +
          ' <span class="muted">×' + (counts[ev.ev_id] || 0) + "</span></button>";
      }).join("");

      el.querySelector("#actions").innerHTML = (PDPEF.normText(query) && !exact
        ? '<button class="btn primary" id="addShared">Add as shared evidence</button> ' +
          '<button class="btn" id="addNote">Add as note for ' + esc(kid.name) + " only</button>"
        : "");

      el.querySelectorAll("#results button").forEach(function (b) {
        b.onclick = function () {
          enqueue("addEntry", { id: crypto.randomUUID(), kidId: kidId, goal: goalCode,
            evId: b.dataset.ev, author: state.user });
          reset();
        };
      });
      el.querySelectorAll("a.rm").forEach(function (a) {
        a.onclick = function (e) {
          e.preventDefault();
          if (confirm("Remove this evidence from " + kid.name + "?")) {
            enqueue("removeEntry", { entryId: a.dataset.entry, author: state.user });
            draw(query);
          }
        };
      });
      el.querySelectorAll("a.undo").forEach(function (a) {
        a.onclick = function (e) {
          e.preventDefault();
          enqueue("removeEntry", { entryId: a.dataset.entry, author: state.user });
          draw(query);
          toast("Removed", "success");
        };
      });
      function addNew(kidOnly) {
        var evId = crypto.randomUUID();
        enqueue("addEvidence", { id: evId, goal: goalCode, text: q.value,
          author: state.user, kidOnly: kidOnly ? kidId : "" });
        enqueue("addEntry", { id: crypto.randomUUID(), kidId: kidId, goal: goalCode,
          evId: evId, author: state.user });
        reset();
      }
      var s = el.querySelector("#addShared"), n = el.querySelector("#addNote");
      if (s) s.onclick = function () { addNew(false); };
      if (n) n.onclick = function () { addNew(true); };
    }
    function reset() { q.value = ""; draw(""); q.focus(); }
    draw("");
  }
  function renderGoal(code) {
    var goal = goalByCode(code);
    if (!goal) { location.hash = "#grid"; return; }
    var v = view();
    var grid = PDPEF.buildGrid(state.data.roster, v.entries);
    var evText = {};
    v.library.forEach(function (e) { evText[e.ev_id] = e; });
    var country = state.goalCountry || myDelegation();
    var kids = state.data.roster.filter(function (k) { return k.country === country; });
    var countries = [];
    state.data.roster.forEach(function (k) {
      if (countries.indexOf(k.country) < 0) countries.push(k.country);
    });
    var gi = PDPEF.GOALS.indexOf(goal);
    var prev = PDPEF.GOALS[(gi + 15) % 16].code, next = PDPEF.GOALS[(gi + 1) % 16].code;
    renderShell("By goal",
      '<div class="card"><a href="#goal/' + prev + '">←</a> <b>' + code + ") " +
      esc(goal.text) + '</b> <a href="#goal/' + next + '">→</a>' +
      '<p class="goalhead">' + esc(PDPEF.AREAS[goal.area]) + "</p>" +
      '<select id="deleg">' + countries.map(function (c) {
        return '<option ' + (c === country ? "selected" : "") + ">" + esc(c) + "</option>";
      }).join("") + "</select> " +
      '<button class="btn" id="multi" style="background-color: #F8F7F4">Add to several kids…</button></div>' +
      kids.map(function (k) {
        var cell = grid[k.kid_id][code] || [];
        return '<div class="card a' + areaOf(code) + '"><b><a href="#kid/' + k.kid_id + '" style="color: #0072CE">' + esc(k.name) +
          "</a></b><br>" + (cell.length ? cell.map(function (en) {
            var ev = evText[en.ev_id] || { text: en.ev_id };
            return '<span class="pill">' + esc(ev.text) + "</span>";
          }).join("") : '<span class="muted">No evidence yet.</span>') +
          '<br><button class="btn" data-kid="' + k.kid_id + '" style="background-color: #F8F7F4">+ Add</button></div>';
      }).join(""));
    document.getElementById("deleg").onchange = function (e) {
      state.goalCountry = e.target.value;
      renderGoal(code);
    };
    document.getElementById("multi").onclick = function () {
      openMultiAdd(code, kids.map(function (k) { return k.kid_id; }));
    };
    document.querySelectorAll(".card .btn[data-kid]").forEach(function (b) {
      b.onclick = function () { openEditor(b.dataset.kid, code, function () { renderGoal(code); }); };
    });
  }

  function openMultiAdd(goalCode, kidIds) {
    // Pick ONE evidence statement, then tick which of these kids it applies to.
    var goal = goalByCode(goalCode);
    var el = document.createElement("div");
    el.className = "sheet"; el.id = "sheet";
    document.body.appendChild(el); // body, not #app — see openEditor
    var chosenEv = null; // {ev_id: existing id or null, text: statement text}
    function draw(query) {
      var v = view();
      var counts = PDPEF.usageCounts(v.entries);
      var results = PDPEF.searchLibrary(v.library, goalCode, query, "", counts).slice(0, 12);
      var exact = PDPEF.findExact(v.library, goalCode, query);
      el.innerHTML = '<div class="panel"><h3>Add to several kids — ' + goalCode + "</h3>" +
        '<p class="goalhead">' + esc(goal.text) + "</p>" +
        (chosenEv
          ? "<p><b>" + esc(chosenEv.text) + "</b></p><div id='kidticks'>" +
            kidIds.map(function (id) {
              var k = kidById(id);
              return '<label class="pill"><input type="checkbox" checked value="' + id + '"> ' +
                esc(k.name) + "</label>";
            }).join("") + "</div>" +
            '<p><button class="btn primary" id="apply">Apply</button> ' +
            '<button class="btn" id="back">Change evidence</button></p>'
          : '<input type="search" id="q" placeholder="Search evidence or type new…" value="' +
            esc(query) + '" autocomplete="off">' +
            '<div class="picker-list" id="results">' + results.map(function (ev) {
              return '<button data-ev="' + ev.ev_id + '" data-text="' + esc(ev.text) + '">' +
                esc(ev.text) + ' <span class="muted">×' + (counts[ev.ev_id] || 0) +
                "</span></button>";
            }).join("") + "</div>" +
            (PDPEF.normText(query) && !exact
              ? '<button class="btn primary" id="newShared">Use as new shared evidence</button>'
              : "")) +
        '<p style="text-align:right"><button class="btn" id="cancel">Close</button></p></div>';
      el.querySelector("#cancel").onclick = function () { closeSheet(); render(); };
      if (chosenEv) {
        el.querySelector("#back").onclick = function () { chosenEv = null; draw(""); };
        el.querySelector("#apply").onclick = function () {
          var evId = chosenEv.ev_id;
          if (!evId) { // brand-new statement: create once, then link
            evId = crypto.randomUUID();
            enqueue("addEvidence", { id: evId, goal: goalCode, text: chosenEv.text,
              author: state.user, kidOnly: "" });
          }
          el.querySelectorAll("#kidticks input:checked").forEach(function (cb) {
            enqueue("addEntry", { id: crypto.randomUUID(), kidId: cb.value, goal: goalCode,
              evId: evId, author: state.user });
          });
          closeSheet();
          render();
        };
      } else {
        var q = el.querySelector("#q");
        q.oninput = function () { draw(q.value); };
        q.focus(); q.setSelectionRange(q.value.length, q.value.length);
        el.querySelectorAll("#results button").forEach(function (b) {
          b.onclick = function () { chosenEv = { ev_id: b.dataset.ev, text: b.dataset.text }; draw(""); };
        });
        var ns = el.querySelector("#newShared");
        if (ns) ns.onclick = function () { chosenEv = { ev_id: null, text: PDPEF.normText(q.value) }; draw(""); };
      }
    }
    draw("");
  }

  function renderKid(kidId) {
    var kid = kidById(kidId);
    if (!kid) { location.hash = "#grid"; return; }
    var v = view();
    var grid = PDPEF.buildGrid(state.data.roster, v.entries);
    var evText = {};
    v.library.forEach(function (e) { evText[e.ev_id] = e; });
    var ids = state.data.roster.map(function (k) { return k.kid_id; });
    var i = ids.indexOf(kidId);
    var prev = ids[(i + ids.length - 1) % ids.length], next = ids[(i + 1) % ids.length];
    renderShell("By kid",
      '<div class="card"><a href="#kid/' + prev + '">←</a> <b>' + esc(kid.name) + " (" +
      esc(kid.country) + ')</b> <a href="#kid/' + next + '">→</a> ' +
      '<a class="btn" style="float: right; background-color: #FFF4E1" href="#print/' + kidId + '">Print</a></div>' +
      PDPEF.GOALS.map(function (g) {
        var cell = grid[kidId][g.code] || [];
        return (g.code[1] === "a"
            ? '<p class="goalhead"><b>' + g.area + ") " + esc(PDPEF.AREAS[g.area]) + "</b></p>" : "") +
          '<div class="card a' + areaOf(g.code) + '" data-goal="' + g.code + '"><b>' + g.code + ") " + esc(g.text) +
          "</b><br>" + (cell.length ? cell.map(function (en) {
            var ev = evText[en.ev_id] || { text: en.ev_id };
            return '<span class="pill' + (ev.kid_only ? " note" : "") + '" style="background-color: #FFF4E1">' + esc(ev.text) +
              (ev.kid_only ? ' <span class="muted">(note)</span>' : "") + "</span>";
          }).join("") : '<span class="muted" style="text-decoration-line: underline">Tap to add evidence.</span>') + "</div>";
      }).join(""));
    document.querySelectorAll(".card[data-goal]").forEach(function (c) {
      c.onclick = function () { openEditor(kidId, c.dataset.goal, function () { renderKid(kidId); }); };
    });
  }
  function renderPrint(sel) {
    var v = view();
    var grid = PDPEF.buildGrid(state.data.roster, v.entries);
    var evText = {};
    v.library.forEach(function (e) { evText[e.ev_id] = e; });
    var kids = sel === "all" ? state.data.roster
      : state.data.roster.filter(function (k) { return k.kid_id === sel; });
    if (!kids.length) { location.hash = "#grid"; return; }
    var pages = kids.map(function (k) {
      return '<div class="printkid" style="max-width:19cm;margin:0 auto 2rem;">' +
        '<div class="printhead"><div class="plogos">' +
        (LOGO_COMBINED || LOGO_MARK || '') + LOGO_GINGA +
        "</div>" +
        "<h2>" + esc(CAMP.name) + (CAMP.year ? " · " + esc(CAMP.year) : "") + "</h2>" +
        (CAMP.theme ? "<p class='theme'>" + esc(CAMP.theme) + "</p>" : "") +
        "<h3>Personal Development Programme Evaluation Form</h3>" +
        "<p><b>" + esc(k.name) + "</b> — " + esc(k.country) + "</p></div>" +
        ["1", "2", "3", "4"].map(function (area) {
          return "<h4 class='pa a" + area + "'>" + area + ") " + esc(PDPEF.AREAS[area]) + "</h4>" +
            '<table style="width:100%;border-collapse:collapse;font-size:.85rem">' +
            PDPEF.GOALS.filter(function (g) { return g.area === area; }).map(function (g) {
              var cell = (grid[k.kid_id] || {})[g.code] || [];
              return '<tr><td style="border:1px solid #999;padding:.3rem;width:38%;vertical-align:top">' +
                g.code + ") " + esc(g.text) + "</td>" +
                '<td style="border:1px solid #999;padding:.3rem;vertical-align:top">' +
                (cell.length ? "<ul style='margin:.1rem 0 .1rem 1.1rem;padding:0'>" +
                  cell.map(function (en) {
                    var ev = evText[en.ev_id] || { text: en.ev_id };
                    return "<li>" + esc(ev.text) + "</li>";
                  }).join("") + "</ul>" : "") +
                "</td></tr>";
            }).join("") + "</table>";
        }).join("") + "</div>";
    }).join("");
    renderShell("Print",
      '<p class="muted noprint">Use your browser\'s Print (share menu on phones) to save as PDF. ' +
      'Printing <b>' + (sel === "all" ? "all " + kids.length + " participants" : esc(kids[0].name)) +
      "</b> — <a href='#print/all'>all</a>.</p>" + pages);
  }

  window.addEventListener("hashchange", render);

  (function start() {
    if (typeof google !== "undefined") { boot(); return; } // served by Apps Script
    if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
      var s = document.createElement("script"); // local dev: load the mock backend
      s.src = "/local/mock.js";
      s.onload = function () { window.MOCK_READY.then(boot); };
      document.head.appendChild(s);
      return;
    }
    if (EXEC_URL) { boot(); return; } // static hosting, already configured
    showSetup(); // static hosting, first visit: ask for the camp code
  })();
</script>
